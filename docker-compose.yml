services:
  postgres:
    image: postgres:16-alpine
    container_name: pulsewatch-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: pulsewatch
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./pulsewatch-backend
      dockerfile: Dockerfile
    container_name: pulsewatch-backend
    ports:
      - "8080:8080"
    environment:
      # Database - uses postgres service name as host
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pulsewatch
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-changeme}
      # JWT - REQUIRED: generate with: openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET}
      # Email alerts - OPTIONAL: leave empty to disable email delivery
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      # CORS - origins allowed to call the API
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      # App base URL - used in email links
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      # Frontend URL - used in email action button links
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      # Spring profile (use 'prod' for Azure, 'default' for local docker)
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      # GitHub OAuth - OPTIONAL: leave empty to disable GitHub login
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost/oauth2/callback/github}
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5

  frontend:
    build:
      context: ./pulsewatch-frontend
      dockerfile: Dockerfile
    container_name: pulsewatch-frontend
    environment:
      # Docker Compose service name — envsubst substitutes this into nginx.conf at startup.
      # On Azure Container Apps set BACKEND_URL=http://pulsewatch-backend instead.
      BACKEND_URL: http://backend:8080
    ports:
      - "80:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  postgres_data:
    driver: local
