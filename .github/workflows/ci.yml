name: CI / CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ==========================================================
  # Backend: Build, Test, and Docker validation
  # ==========================================================
  backend:
    name: Backend (Java 21 / Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./pulsewatch-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build and test
        run: mvn -B clean verify
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || '404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970' }}

  # ==========================================================
  # Frontend: Install, Build
  # ==========================================================
  frontend:
    name: Frontend (Node 20 / React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./pulsewatch-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: pulsewatch-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

  # ==========================================================
  # Docker: Validate both images build correctly
  # ==========================================================
  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t pulsewatch-backend:ci ./pulsewatch-backend

      - name: Build frontend Docker image
        run: docker build -t pulsewatch-frontend:ci ./pulsewatch-frontend

      - name: Validate docker compose configuration
        run: |
          JWT_SECRET=test_secret_for_ci_validation_only_not_real docker compose config --quiet
        env:
          JWT_SECRET: test_secret_for_ci_validation_only_not_real
