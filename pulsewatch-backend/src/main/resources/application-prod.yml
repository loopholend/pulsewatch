spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pulsewatch}?sslmode=require
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      keepalive-time: 60000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  forward-headers-strategy: framework
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    org.springframework.web: WARN
    com.pulsewatch.backend: INFO
    org.hibernate: WARN

pulsewatch:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:https://pulsewatch.azurecontainerapps.io}
  incident:
    failure-threshold: 3
  scheduler:
    thread-pool-size: 20
    interval-ms: 60000
    timeout-ms: 30000

app:
  base-url: ${APP_BASE_URL:https://pulsewatch.azurecontainerapps.io}
