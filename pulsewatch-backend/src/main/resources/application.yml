spring:
  application:
    name: pulsewatch-backend
  datasource:
    # DB_HOST: use "postgres" in docker-compose, "localhost" for local dev
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pulsewatch}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      validation-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000
  refresh-expiration-ms: 604800000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

spring.jpa.open-in-view: false

# Mail: OPTIONAL - leave username/password empty to disable email delivery
# When credentials are empty, auth and starttls are disabled automatically
spring.mail:
  host: ${MAIL_HOST:smtp.mailtrap.io}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  properties:
    mail:
      smtp:
        auth: ${MAIL_SMTP_AUTH:false}
        starttls:
          enable: ${MAIL_SMTP_STARTTLS:false}
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000

server:
  forward-headers-strategy: framework
  port: 8080
  # Graceful shutdown
  shutdown: graceful

spring.lifecycle:
  timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  frontend-url: ${FRONTEND_URL:http://localhost}

logging:
  level:
    org.springframework.web: INFO
    com.pulsewatch.backend: INFO

pulsewatch:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  incident:
    failure-threshold: ${FAILURE_THRESHOLD:3}
  scheduler:
    thread-pool-size: ${SCHEDULER_THREAD_POOL:20}
  data:
    pruning:
      enabled: ${PRUNING_ENABLED:true}
      days-to-keep: ${PRUNING_DAYS:30}
